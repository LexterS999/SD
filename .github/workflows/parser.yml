name: Парсер

on:
  schedule:
    - cron: '0 */3 * * *' # Запуск каждые 3 часа
  workflow_dispatch:
    inputs:
      collection_period_days:
        description: 'Период сбора данных в днях (телеграм-каналы и профили собираются за последние N дней)'
        required: false
        default: '7'
        type: string
      dedup_level:
        description: 'Уровень дедупликации (off, light, medium, aggressive)'
        required: false
        default: 'medium'
        type: choice
        options:
          - off
          - light
          - medium
          - aggressive
      tcp_check_enabled:
        description: 'Включить TCP проверку профилей на работоспособность'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: ⚙️ Setup environment variables
        run: |
          echo "DEDUP_LEVEL=${{ github.event.inputs.dedup_level || 'medium' }}" >> $GITHUB_ENV
          echo "TCP_CHECK_ENABLED=${{ github.event.inputs.tcp_check_enabled || 'true' }}" >> $GITHUB_ENV
          echo "COLLECTION_PERIOD_DAYS=${{ github.event.inputs.collection_period_days || '7' }}" >> $GITHUB_ENV

      - name: 🚀 Запуск парсера
        run: |
          python parser.py

      - name: 📤 Commit and push output files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/bad_channels.txt output/best_channels.txt output/protocols.txt output/stats.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update output files [skip ci]"
            git push
          fi

      - name: 📦 Upload output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parser-output
          path: output/
          retention-days: 7
