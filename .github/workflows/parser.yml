name: Парсинг

on:
  schedule:
    - cron: '0 */3 * * *' # Запуск каждые 3 часа
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parse_and_notify:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🚀 Парсинг и Уведомление
        run: |
          python parser.py
          echo "Уведомление о завершении: Парсинг успешно завершен."

      - name: 📤 Upload output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parser-output
          path: output/
          retention-days: 7
