name: SD Pipeline

on:
  schedule:
    - cron: '0 * * * *' # Запуск каждый час
  workflow_dispatch:

jobs:
  parse_and_notify:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Парсинг
        run: |
          python main.py
          echo "Уведомление о завершении: Парсинг успешно завершен."
